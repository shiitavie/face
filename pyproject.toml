[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facecav"
version = "0.1.0"
description = "Ordinal Visual Concept Ranking for auditing MLLM facial attractiveness judgments"
requires-python = ">=3.10"

# torch is deliberately absent from the core dependencies. Colab ships a
# CUDA-matched build and reinstalling it is the classic way to break the
# runtime. Install it via the "local" extra, or separately matched to the
# machine's CUDA version.
dependencies = [
    "transformers>=4.51,<5",
    "accelerate>=1.0",
    "qwen-vl-utils>=0.0.8",
    "pillow>=10.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
    "anthropic>=0.97",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Everything needed to run models and the test suite on this machine. Do NOT
# install this extra on Colab -- it would replace the CUDA-matched torch.
local = ["torch>=2.4"]
docs = ["python-docx>=1.1"]

[tool.setuptools.packages.find]
include = ["facecav*"]
